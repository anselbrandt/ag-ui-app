[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "logfire[fastapi,httpx,redis,sqlalchemy]>=4.17.0",
    "pydantic-ai-slim[a2a,ag-ui,logfire,openai,tavily,ui]>=1.40.0",
    "python-dotenv>=1.2.1",
    "redis[hiredis]>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "tavily-python>=0.7.17",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "taskipy>=1.14.1",
    "ty>=0.0.11",
]

[tool.taskipy.tasks]
check = "uv run ty check"
dev = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
lint = "uv run ruff check"
start = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
